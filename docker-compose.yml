version: '1'
services:
  adminer:
    image: adminer
    container_name: snipscribe-adminer
    restart: always
    ports:
      - 8081:8080
    environment:
      - ADMINER_DEFAULT_SERVER=snipscribe-db
    networks:
      - snipscribe-network

  snipscribe-db:
    image: postgres:latest
    container_name: snipscribe-db
    ports:
      - 5432:5432
    restart: always
    environment:
      - POSTGRES_PASSWORD=root
      - MARIADB_DATABASE=snipscribe
      - POSTGRES_USER=root
    volumes:
      - db_data_development:/var/lib/postgresql
    networks:
      - snipscribe-network

volumes:
  db_data_development:
networks:
  snipscribe-network:
