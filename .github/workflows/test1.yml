name: Set Linked Issues Status to In Review
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  set_linked_issues_status:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: sudo apt-get install -y jq

      - uses: octokit/graphql-action@v2.x
        id: get_linked_issues
        name: Get linked issues
        with:
          query: |
            {
              resource(url: "https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/pull/${{ github.event.number }}") {
                ... on PullRequest {
                  timelineItems(itemTypes: [CONNECTED_EVENT, DISCONNECTED_EVENT], first: 250) {
                    nodes {
                      ... on ConnectedEvent {
                        __typename
                        subject {
                          ... on Issue {
                            number
                            id
                          }
                        }
                      }
                      ... on DisconnectedEvent {
                        __typename
                        subject {
                          ... on Issue {
                            number
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set status of linked issues to '👀 In review'
        env:
          LINKED_ISSUES: ${{ steps.get_linked_issues.outputs.data }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository_owner }}/${{ github.event.repository.name }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          STATUS_FIELD_ID: ${{ secrets.STATUS_FIELD_ID }}
        run: |
          linked_issues="$(echo "$LINKED_ISSUES")"
          mapfile -t connectedIssues < <(echo "$linked_issues" | jq -r '.resource.timelineItems.nodes[] | select(.__typename == "ConnectedEvent") | .subject.number')

          for issue in "${connectedIssues[@]}"; do
            echo "Processing issue #$issue"
            # Get project item ID (replace `ORG` and `PROJECT_NUMBER` accordingly)
            item_id=$(gh project item-list $PROJECT_ID --owner ${{ github.repository_owner }} --json content | jq -r ".[] | select(.content.number==$issue) | .id")
            if [ -z "$item_id" ]; then
              echo "No project item found for issue #$issue"
              continue
            fi
            # Set the status field
            gh project item-edit $PROJECT_ID --id "$item_id" --field-id $STATUS_FIELD_ID --value "👀 In review"
          done
